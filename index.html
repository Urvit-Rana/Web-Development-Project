<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <title>Employee Management System</title>
  </head>
  <body>
    <h1 id="heading">Employee Management System</h1>
    <div class="container">
      <div class="searchbar">
        <!-- button for searching employee -->
        <label for="findEmployee">Search Employee:</label>
        <input type="text" id="findEmployee" />
        <button id="searchEmployee">Search</button>
        <br />
        <!-- <p id="demo">The Time is?</p> -->
      </div>
      <div class="department">
        <br />
        <!-- Search by department(using select and option) -->
        <label>Search Employee By Department:</label>
        <select id="select_department">
          <option value="default">-Select Department-</option>
          <option value="frontend">Frontend Developer</option>
          <option value="backend">Backned Developer</option>
          <option value="fullstack">Full Stack Developer</option>
          <option value="devops">Devops</option>
          <option value="cloud">Cloud Engineer</option>
        </select>
        <div id="div_of_sortBySalary">
          <!-- sorting by salary -->
          <label>Sort By Salary</label>
          <select id="sortBySalary">
            <option id="default">-Sort By Salary-</option>
            <option id="increasing1" value="increasing">low to high</option>
            <option id="decreasing2" value="decreasing">high to low</option>
          </select>
        </div>
      </div>
      <div class="addEmployee">
        <!-- Add employee to the object -->
        <label><h3>Add Employee:</h3></label>
        <div class="add_details">
          <label for="nameInput">Name:</label>
          <input type="text" id="nameInput" /><br />
          <label for="deptInput">Department:</label>
          <input type="text" id="deptInput" /><br />
          <label for="salaryInput">Salary:</label>
          <input type="number" id="salaryInput" />
          <button  type="submit" id="employeeInputbtn">ADD</button>
        </div>
      </div>

      <div class="employeeList1" id="employeeList">
        <h2>Show Employee:</h2>
      </div>

      <button id="btn2">DEMO</button>
      <p id="demo para">Click The Button</p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
